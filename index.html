<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Secure Smart Formatter</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    padding: 20px;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 220px;
    padding: 10px;
    font-size: 14px;
}

button {
    margin-top: 10px;
    margin-right: 10px;
    padding: 12px 20px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.output {
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 8px;
    line-height: 1.6;
    user-select: none;
}

.output h1 { font-size: 26px; }
.output h2 { font-size: 22px; margin-top: 20px; }
.output h3 { font-size: 18px; margin-top: 15px; }
.output p { margin: 10px 0; }

.warning {
    color: red;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>Secure Smart Formatter</h1>

<textarea id="inputText" placeholder="Paste content here..."></textarea>
<br>

<button onclick="formatContent()">Convert to Clean Format</button>
<button onclick="copyOutput()">Copy Output</button>

<div class="warning">Copy, inspect, and right-click are restricted</div>

<div class="output" id="output"></div>

<script>
// FORMATTER
function formatContent() {
    let raw = document.getElementById("inputText").value;
    let lines = raw.split(/\n+/);
    let html = "";

    lines.forEach(line => {
        let text = line.trim();
        if (!text) return;

        if (/^¿.*\?$/.test(text)) {
            html += "<h2>" + escapeHTML(text) + "</h2>";
        }
        else if (text.length > 60 && text === text.toUpperCase()) {
            html += "<h1>" + escapeHTML(text) + "</h1>";
        }
        else if (text.length < 80 && text.endsWith("?")) {
            html += "<h3>" + escapeHTML(text) + "</h3>";
        }
        else {
            html += "<p>" + escapeHTML(text) + "</p>";
        }
    });

    document.getElementById("output").innerHTML = html;
}

// ESCAPE HTML
function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

// ✅ COPY WITH FORMATTING (FIXED)
function copyOutput() {
    let content = document.getElementById("output").innerHTML;

    navigator.clipboard.write([
        new ClipboardItem({
            "text/html": new Blob([content], { type: "text/html" }),
            "text/plain": new Blob([content], { type: "text/plain" })
        })
    ]).then(() => {
        alert("Formatted content copied!");
    }).catch(() => {
        alert("Copy failed. Use Chrome and open via localhost or extension.");
    });
}

// 🚫 Disable right-click
document.addEventListener("contextmenu", e => e.preventDefault());

// 🚫 Disable keys
document.addEventListener("keydown", function(e) {
    if (e.key === "F12") e.preventDefault();

    if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "C")) {
        e.preventDefault();
    }

    if (e.ctrlKey && (e.key === "u" || e.key === "U")) {
        e.preventDefault();
    }

    if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
        e.preventDefault();
    }
});
</script>

</body>
</html>
