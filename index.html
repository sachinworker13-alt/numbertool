<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Smart Formatter PRO</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    padding: 20px;
}

h1 { text-align: center; }

textarea {
    width: 100%;
    height: 220px;
    padding: 10px;
    font-size: 14px;
}

button {
    margin-top: 10px;
    margin-right: 10px;
    padding: 12px 20px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.output {
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 8px;
    line-height: 1.6;
}

.output h1 { font-size: 26px; margin-top: 20px; }
.output p { margin: 10px 0; }
</style>
</head>

<body>

<h1>Smart Formatter PRO</h1>

<textarea id="inputText" placeholder="Paste content here..."></textarea>
<br>

<button onclick="formatContent()">Convert</button>
<button onclick="copyOutput()">Copy Output</button>

<div class="output" id="output"></div>

<script>
function formatContent() {
    let raw = document.getElementById("inputText").value;

    // 🔥 Step 1: Merge multiline questions
    // Combine lines that belong to same question
    raw = raw.replace(/¿[\s\S]*?\?/g, match => {
        return match.replace(/\n+/g, ' ').trim();
    });

    let lines = raw.split(/\n+/);
    let html = "";

    lines.forEach(line => {
        let text = line.trim();
        if (!text) return;

        // ✅ FULL QUESTION → H1
        if (/^¿.*\?$/.test(text)) {
            html += "<h1>" + escapeHTML(text) + "</h1>";
        }
        else {
            html += "<p>" + escapeHTML(text) + "</p>";
        }
    });

    document.getElementById("output").innerHTML = html;
}

// escape
function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

// copy with formatting
function copyOutput() {
    let content = document.getElementById("output").innerHTML;

    navigator.clipboard.write([
        new ClipboardItem({
            "text/html": new Blob([content], { type: "text/html" }),
            "text/plain": new Blob([content], { type: "text/plain" })
        })
    ]).then(() => {
        alert("Copied!");
    });
}
</script>

</body>
</html>
