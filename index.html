<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Smart Formatter PRO (Secure)</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    padding: 20px;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 220px;
    padding: 10px;
    font-size: 14px;
}

button {
    margin-top: 10px;
    margin-right: 10px;
    padding: 12px 20px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.output {
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 8px;
    line-height: 1.6;

    /* 🚫 prevent selection */
    user-select: none;
}

/* ✅ left align headings */
.output h1 {
    text-align: left;
    font-size: 26px;
    margin-top: 20px;
}

.output p {
    margin: 10px 0;
}

.warning {
    color: red;
    text-align: center;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>Smart Formatter PRO</h1>

<textarea id="inputText" placeholder="Paste content here..."></textarea>
<br>

<button onclick="formatContent()">Convert</button>
<button onclick="copyOutput()">Copy Output</button>

<div class="warning">Right click, copy & inspect are restricted</div>

<div class="output" id="output"></div>

<script>
// ================= FORMATTER =================
function formatContent() {
    let raw = document.getElementById("inputText").value;

    // Merge multiline questions
    raw = raw.replace(/¿[\s\S]*?\?/g, m => m.replace(/\n+/g, ' ').trim());

    let lines = raw.split(/\n+/);
    let html = "";

    lines.forEach(line => {
        let text = line.trim();
        if (!text) return;

        let matches = text.match(/¿[\s\S]*?\?/g);

        if (matches) {
            // First question → H1
            html += "<h1>" + escapeHTML(matches[0]) + "</h1>";

            // Remaining content
            let remaining = text.replace(matches[0], "").trim();

            if (matches.length > 1) {
                let restQuestions = matches.slice(1).join(" ");
                remaining = (restQuestions + " " + remaining).trim();
            }

            if (remaining) {
                html += "<p>" + escapeHTML(remaining) + "</p>";
            }
        } else {
            html += "<p>" + escapeHTML(text) + "</p>";
        }
    });

    document.getElementById("output").innerHTML = html;
}

// escape HTML
function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

// ================= COPY (ALLOWED) =================
function copyOutput() {
    let content = document.getElementById("output").innerHTML;

    navigator.clipboard.write([
        new ClipboardItem({
            "text/html": new Blob([content], { type: "text/html" }),
            "text/plain": new Blob([content], { type: "text/plain" })
        })
    ]).then(() => {
        alert("Copied!");
    }).catch(() => {
        alert("Copy failed. Use Chrome + localhost.");
    });
}

// ================= BASIC PROTECTION =================

// 🚫 disable right click
document.addEventListener("contextmenu", e => e.preventDefault());

// 🚫 disable selection outside textarea
document.addEventListener("selectstart", function(e) {
    if (!e.target.closest("#inputText")) {
        e.preventDefault();
    }
});

// 🚫 block inspect + shortcuts (but allow our copy button)
document.addEventListener("keydown", function(e) {

    // F12
    if (e.key === "F12") {
        e.preventDefault();
    }

    // Ctrl+Shift+I / Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "C")) {
        e.preventDefault();
    }

    // Ctrl+U
    if (e.ctrlKey && (e.key === "u" || e.key === "U")) {
        e.preventDefault();
    }

    // Ctrl+C → block ONLY outside textarea
    if (e.ctrlKey && (e.key === "c" || e.key === "C")) {
        let active = document.activeElement;
        if (active.id !== "inputText") {
            e.preventDefault();
        }
    }
});
</script>

</body>
</html>
