<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Smart Content Formatter</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    padding: 20px;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 220px;
    padding: 10px;
    font-size: 14px;
}

button {
    margin-top: 10px;
    padding: 12px 20px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.output {
    margin-top: 25px;
    background: white;
    padding: 20px;
    border-radius: 8px;
    line-height: 1.6;
}

.output h2 {
    margin-top: 20px;
    color: #222;
}

.output p {
    margin: 10px 0;
}
</style>
</head>

<body>

<h1>Smart Content Formatter (No Data Loss)</h1>

<textarea id="inputText" placeholder="Paste content here..."></textarea>
<br>
<button onclick="formatContent()">Convert to Clean Format</button>

<div class="output" id="output"></div>

<script>
function formatContent() {
    let raw = document.getElementById("inputText").value;

    // Keep original lines
    let lines = raw.split(/\n+/);

    let html = "";

    lines.forEach(line => {
        let text = line.trim();

        if (!text) return;

        // Detect headings (Spanish questions like ¿...?)
        if (/^¿.*\?$/.test(text)) {
            html += "<h2>" + escapeHTML(text) + "</h2>";
        }
        // Detect titles (ALL CAPS or longer strong lines)
        else if (text.length > 60 && text === text.toUpperCase()) {
            html += "<h1>" + escapeHTML(text) + "</h1>";
        }
        // Detect sub headings (short strong lines)
        else if (text.length < 80 && text.endsWith("?")) {
            html += "<h3>" + escapeHTML(text) + "</h3>";
        }
        else {
            html += "<p>" + escapeHTML(text) + "</p>";
        }
    });

    document.getElementById("output").innerHTML = html;
}

function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
</script>

</body>
</html>
