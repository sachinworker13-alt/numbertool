<meta charset="UTF-8">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    padding: 20px;
}

h1 {
    text-align: center;

    width: 100%;

button {
    margin-top: 10px;
    padding: 12px 20px;
    font-size: 16px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.output {
    margin-top: 25px;
    background: white;
    padding: 20px;

    line-height: 1.6;
}

h2 {
    margin-top: 25px;
}

<body>

<h1>Content Formatter Tool</h1>

<textarea id="inputText" placeholder="Paste messy content here..."></textarea>
<br>
<button onclick="formatContent()">Convert to Clean Format</button>

<div class="output" id="output"></div>

<script>
function cleanText(text) {
    return text
        .replace(/[{}[\]#@~*✈✨•►]/g, '') // remove junk symbols
        .replace(/\s+/g, ' ') // normalize spaces
        .trim();
}

function formatContent() {
    let raw = document.getElementById("inputText").value;

    let cleaned = cleanText(raw);

    // Extract questions
    let questions = cleaned.match(/¿[^?]+\?/g) || [];

    // Remove duplicates
    questions = [...new Set(questions)];

    // Extract sentences
    let sentences = cleaned.split('.').map(s => s.trim()).filter(s => s.length > 20);

    let outputHTML = "";

    questions.forEach((q, index) => {
        outputHTML += `<h2>${q}</h2>`;

        // attach relevant sentences (skip ones already used)
        let related = sentences.slice(index * 3, index * 3 + 3);

        let paragraph = related.join('. ') + '.';

        // remove repeated phone numbers
        paragraph = paragraph.replace(/(\+?\d[\d\-\s]{7,})/g, (match, p1, offset, string) => {
            return string.indexOf(match) === offset ? match : '';
        });

        outputHTML += `<p>${paragraph}</p>`;
    });

    document.getElementById("output").innerHTML = outputHTML;
}
</script>
